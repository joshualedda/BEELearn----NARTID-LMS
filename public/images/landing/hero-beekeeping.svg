<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="honeyGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E5A900"/>
      <stop offset="50%" stop-color="#F4C430"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>
    <linearGradient id="beeGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#0D0D0D"/>
    </linearGradient>
    <linearGradient id="hiveGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B5A2B"/>
      <stop offset="100%" stop-color="#5D3A1A"/>
    </linearGradient>
    <linearGradient id="leafGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2D5A27"/>
      <stop offset="100%" stop-color="#1B3A18"/>
    </linearGradient>
    <pattern id="honeycombPattern" x="0" y="0" width="40" height="34.64" patternUnits="userSpaceOnUse">
      <path d="M20 0 L40 8.66 L40 25.98 L20 34.64 L0 25.98 L0 8.66 Z" fill="none" stroke="#E5A900" stroke-width="0.5" opacity="0.15"/>
    </pattern>
  </defs>
  
  <!-- Background honeycomb pattern -->
  <rect width="600" height="500" fill="url(#honeycombPattern)"/>
  
  <!-- Floating decorative elements -->
  <!-- Large honeycomb cluster -->
  <g transform="translate(450, 80)" opacity="0.1">
    <path d="M20 0 L40 8.66 L40 25.98 L20 34.64 L0 25.98 L0 8.66 Z" fill="url(#honeyGradient)" stroke="#E5A900" stroke-width="1"/>
    <path d="M60 8.66 L80 17.32 L80 34.64 L60 43.3 L40 34.64 L40 17.32 Z" fill="url(#honeyGradient)" stroke="#E5A900" stroke-width="1"/>
    <path d="M20 34.64 L40 43.3 L40 60.62 L20 69.28 L0 60.62 L0 43.3 Z" fill="url(#honeyGradient)" stroke="#E5A900" stroke-width="1"/>
  </g>
  
  <!-- Bee illustration - main focus -->
  <g transform="translate(300, 250)">
    <!-- Wings -->
    <ellipse cx="-35" cy="-20" rx="28" ry="18" fill="#FFFFFF" fill-opacity="0.3" stroke="#E5A900" stroke-width="0.5" transform="rotate(-30)"/>
    <ellipse cx="35" cy="-20" rx="28" ry="18" fill="#FFFFFF" fill-opacity="0.3" stroke="#E5A900" stroke-width="0.5" transform="rotate(30)"/>
    <ellipse cx="-25" cy="-30" rx="18" ry="12" fill="#FFFFFF" fill-opacity="0.2" transform="rotate(-30)"/>
    <ellipse cx="25" cy="-30" rx="18" ry="12" fill="#FFFFFF" fill-opacity="0.2" transform="rotate(30)"/>
    
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="22" ry="30" fill="url(#beeGradient)"/>
    
    <!-- Yellow stripes -->
    <ellipse cx="0" cy="-12" rx="18" ry="6" fill="#E5A900"/>
    <ellipse cx="0" cy="0" rx="16" ry="6" fill="#E5A900"/>
    <ellipse cx="0" cy="12" rx="14" ry="6" fill="#E5A900"/>
    
    <!-- Head -->
    <circle cx="0" cy="-32" r="16" fill="url(#beeGradient)"/>
    
    <!-- Eyes -->
    <circle cx="-7" cy="-35" r="4" fill="#FFFFFF"/>
    <circle cx="7" cy="-35" r="4" fill="#FFFFFF"/>
    <circle cx="-6" cy="-35" r="1.5" fill="#1A1A1A"/>
    <circle cx="8" cy="-35" r="1.5" fill="#1A1A1A"/>
    
    <!-- Antennae -->
    <path d="M-10 -45 Q-20 -60 -15 -70" stroke="#1A1A1A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M10 -45 Q20 -60 15 -70" stroke="#1A1A1A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="-15" cy="-70" r="3" fill="#E5A900"/>
    <circle cx="15" cy="-70" r="3" fill="#E5A900"/>
    
    <!-- Legs -->
    <path d="M-20 5 Q-30 15 -35 20" stroke="#1A1A1A" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M20 5 Q30 15 35 20" stroke="#1A1A1A" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M-22 15 Q-35 25 -40 30" stroke="#1A1A1A" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M22 15 Q35 25 40 30" stroke="#1A1A1A" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M-20 25 Q-30 35 -35 40" stroke="#1A1A1A" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M20 25 Q30 35 35 40" stroke="#1A1A1A" stroke-width="2" fill="none" stroke-linecap="round"/>
    
    <!-- Stinger -->
    <path d="M0 30 L0 42" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Beehive on the right -->
  <g transform="translate(480, 320)">
    <!-- Hive body -->
    <path d="M-50 0 Q-50 -20 -30 -30 Q-10 -40 10 -30 Q30 -20 30 0 Q50 10 30 30 Q10 50 -10 40 Q-30 30 -50 20 Z" fill="url(#hiveGradient)" stroke="#5D3A1A" stroke-width="2"/>
    
    <!-- Hive entrance -->
    <ellipse cx="0" cy="15" rx="12" ry="8" fill="#1A1A1A"/>
    <ellipse cx="0" cy="15" rx="8" ry="5" fill="#E5A900" fill-opacity="0.3"/>
    
    <!-- Hive rings -->
    <path d="M-45 5 Q0 -5 45 5" stroke="#5D3A1A" stroke-width="1" fill="none" opacity="0.5"/>
    <path d="M-40 20 Q0 10 40 20" stroke="#5D3A1A" stroke-width="1" fill="none" opacity="0.5"/>
    <path d="M-35 35 Q0 25 35 35" stroke="#5D3A1A" stroke-width="1" fill="none" opacity="0.5"/>
    
    <!-- Bees around hive -->
    <g transform="translate(-60, -20)">
      <ellipse cx="0" cy="0" rx="4" ry="3" fill="#1A1A1A"/>
      <ellipse cx="0" cy="-2" rx="3" ry="1.5" fill="#E5A900"/>
    </g>
    <g transform="translate(-70, -40)">
      <ellipse cx="0" cy="0" rx="3" ry="2" fill="#1A1A1A"/>
      <ellipse cx="0" cy="-1.5" rx="2" ry="1" fill="#E5A900"/>
    </g>
    <g transform="translate(60, -25)">
      <ellipse cx="0" cy="0" rx="4" ry="3" fill="#1A1A1A"/>
      <ellipse cx="0" cy="-2" rx="3" ry="1.5" fill="#E5A900"/>
    </g>
    <g transform="translate(75, -45)">
      <ellipse cx="0" cy="0" rx="3" ry="2" fill="#1A1A1A"/>
      <ellipse cx="0" cy="-1.5" rx="2" ry="1" fill="#E5A900"/>
    </g>
  </g>
  
  <!-- Floating leaves -->
  <g transform="translate(100, 120)" opacity="0.6">
    <path d="M0 0 Q20 -30 40 0 Q20 30 0 0" fill="url(#leafGradient)"/>
    <path d="M0 0 Q10 -15 20 0" stroke="#2D5A27" stroke-width="1.5" fill="none"/>
  </g>
  
  <g transform="translate(50, 380)" opacity="0.4">
    <path d="M0 0 Q15 -25 30 0 Q15 25 0 0" fill="url(#leafGradient)"/>
    <path d="M0 0 Q7.5 -12.5 15 0" stroke="#2D5A27" stroke-width="1" fill="none"/>
  </g>
  
  <g transform="translate(520, 420)" opacity="0.5">
    <path d="M0 0 Q-18 -20 -35 0 Q-18 20 0 0" fill="url(#leafGradient)"/>
    <path d="M0 0 Q-9 -10 -17.5 0" stroke="#2D5A27" stroke-width="1" fill="none"/>
  </g>
  
  <!-- Small floating honey drops -->
  <g fill="#E5A900" opacity="0.4">
    <circle cx="150" cy="80" r="4"/>
    <circle cx="550" cy="150" r="3"/>
    <circle cx="80" cy="400" r="5"/>
    <circle cx="520" cy="380" r="3"/>
    <circle cx="200" cy="300" r="2"/>
    <circle cx="400" cy="100" r="4"/>
  </g>
  
  <!-- Pollen particles -->
  <g fill="#F4C430" opacity="0.3">
    <circle cx="120" cy="200" r="2"/>
    <circle cx="480" cy="180" r="1.5"/>
    <circle cx="60" cy="300" r="2.5"/>
    <circle cx="540" cy="350" r="1.5"/>
    <circle cx="300" cy="450" r="2"/>
  </g>
</svg>